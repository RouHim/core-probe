<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
  </defs>

  <!-- App tile backdrop -->
  <rect x="0" y="0" width="128" height="128" rx="14" fill="#121215"/>

  <!-- Chip package (diamond) -->
  <polygon points="64,16 112,64 64,112 16,64" fill="url(#chipGrad)" stroke="#2a2a32" stroke-width="0.5"/>

  <!-- Inner die perimeter -->
  <polygon points="64,30 98,64 64,98 30,64" fill="none" stroke="#353544" stroke-width="0.75"/>

  <!-- Muted vertex markers -->
  <circle cx="64" cy="16" r="1.5" fill="#3a3a48"/>
  <circle cx="64" cy="112" r="1.5" fill="#3a3a48"/>
  <circle cx="16" cy="64" r="1.5" fill="#3a3a48"/>

  <!-- Probe pulse rings at right vertex -->
  <circle cx="112" cy="64" r="18" fill="#4caf50" opacity="0.05"/>
  <circle cx="112" cy="64" r="10" fill="#4caf50" opacity="0.10"/>
  <circle cx="112" cy="64" r="4" fill="#4caf50" opacity="0.65"/>
  <circle cx="112" cy="64" r="1.5" fill="#4caf50"/>
</svg>
